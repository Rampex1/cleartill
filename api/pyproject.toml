[project]
name = "cleartill-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
