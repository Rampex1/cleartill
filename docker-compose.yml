services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cleartill
      POSTGRES_PASSWORD: cleartill
      POSTGRES_DB: cleartill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleartill"]
      interval: 2s
      retries: 15
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://cleartill:cleartill@db:5432/cleartill
      SECRET_KEY: dev-only-secret-change-me-0123456789abcdef
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
