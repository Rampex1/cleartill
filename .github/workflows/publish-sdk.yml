name: publish-sdk
# Pushing a tag like sdk-v0.1.0 publishes the SDK to TestPyPI through Trusted Publishing
# (OIDC, no stored token). One-time setup on test.pypi.org: add a pending publisher for
# project "cleartill", this repository, workflow "publish-sdk.yml", environment "testpypi".
on:
  push:
    tags: ["sdk-v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 15
    # Job permissions replace the workflow's: keep contents:read (private repo checkout).
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Tag matches the package version
        run: |
          version=$(uv version --short)
          test "${GITHUB_REF_NAME#sdk-v}" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      # Pinned to a commit: this step runs with id-token:write.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: sdk/dist/
