name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: api
      - run: uv run playwright install --with-deps chromium
        working-directory: api
      - run: uv run pytest -q tests/e2e tests/test_frontend.py
        working-directory: api
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]  # the floor and the version we develop on
    defaults:
      run:
        working-directory: sdk
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
  openapi:
    # The spec must generate a client (design §5.14); the generated code is discarded.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      SECRET_KEY: ci-only-openapi-check-0123456789abcdef
      PUBLIC_BASE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > /tmp/openapi.json
      - run: uvx openapi-python-client@0.30.0 generate --path /tmp/openapi.json --output-path /tmp/generated --overwrite --fail-on-warning
  smoke:
    # The README quickstart, end to end, against the compose stack.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: docker compose up -d --build --wait
      - run: uv run --with ./sdk scripts/smoke.py http://localhost:8000
      - if: failure()
        run: docker compose logs --tail 200
